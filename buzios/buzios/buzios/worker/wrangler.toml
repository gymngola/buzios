name = "buzios-publish"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = true

# Cron: every ~6 days at 03:00 UTC (days 1,7,13,19,25 of month).
# Runs scheduled() → d1BackupToCloudinary → Cloudinary dated + latest snapshots.
# Time Travel on Free is only 7 days; this keeps an off-platform copy beyond that window.
[triggers]
crons = ["0 3 1,7,13,19,25 * *"]

# D1 — operational data (clients, submissions, newsletter)
# Create DB once:  npx wrangler d1 create buzios-db
# Then paste the database_id below and run migrations.
[[d1_databases]]
binding = "DB"
database_name = "buzios-db"
database_id = "e02a0a4d-a82e-437e-8466-6e985e417eaf"
migrations_dir = "migrations"
