name = "buzios-publish"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = true

# D1 — operational data (clients, submissions, newsletter)
# Create DB once:  npx wrangler d1 create buzios-db
# Then paste the database_id below and run migrations.
[[d1_databases]]
binding = "DB"
database_name = "buzios-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
